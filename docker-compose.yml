version: "3.9"

services:

  backend:
    build: ./backend
    container_name: rag-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend/storage:/backend/storage
      - ./backend/uploads:/backend/uploads
    
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:8000/health"]

      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: rag-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    environment:
      - VITE_API_BASE_URL=http://localhost:8000